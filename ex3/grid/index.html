<!DOCTYPE html>
<html lang="TH">
    <head>
        <meta charset="UTF-8">
        <meta name="viweport" content="width=device-width, initial-scale=1.0">
        <title>Chat</title>
        <style>
            *{
            margin:  0;
            padding: 0;
            box-sizing: border-box;
        }body {
            font-family: Arial, sans-serif;
            padding-left: 8px;
            padding-right: 8px;
            padding-top: 8px;
            }
        .container{
            width: auto ;
            display: grid;
            grid-column: repeat(4 , 1fr);
            grid-template-rows: 80px 170px 80px;

        }
        header{
            grid-column: 1 / 5;
            grid-row: 1;
            background-color: chartreuse;
        }
        .left {
            grid-column: 1 / 2;
            grid-row: 2;
            background-color: orchid;
            }

        main {
            grid-column: 2 / 4;
            grid-row: 2;
            background-color: white;
            }

        .right {
            grid-column: 4 / 5;
            grid-row: 2;
            background-color: orchid;
            }
        footer {
            grid-column: 1/5;
            grid-row: 3;
            background-color: chartreuse;
        }
        header,
        aside,
        main,
        footer {
            padding: 8px;
            border: 1px solid #333;
        }

        
        
        </style>
    </head>

    <body>
        <div class="container">
        <header>header</header>
        <aside class="left">
            laft aside
        </aside>
        <aside class="right">
            right aside
        </aside>
        <main>
            main
        </main>
        <footer>footer
        </footer>
        </div>
    </body>

</html>
