<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SemanticLayout</title>
        <style>
            *{
            margin:  0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: white;
            font-family: Arial, sans-serif;
            color: white;
        }
        .layout{
            width: 800px;
            max-width: 100%;
            padding: 20px;
            background-color: #c7edf7;
        }
        header,
        footer{
            height: 70px;
            display: grid;
            place-items: center;
            background-color: #10bbb1;
            font-size: 26px;
        }
        main{
            min-height: 400px;
            display: grid;
            grid-template-columns: 1fr 2.4fr;
            gap: 20px;
            margin: 20px 0;
        }
        aside{
            display: grid;
            place-items: center;
            background-color: #69d766;
            font-size: 26px;
        }
        article{
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #ffb34f;;
        }
        article h1{
            flex: 1;
            display: grid;
            place-items: center;
            font-size: 26px;
            font-weight: normal;
        }
        .image{
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 16px;
        }
        .image figure{
            height: 150px;
            display: grid;
            place-items: center;
            background-color: #ffd34f;
            font-size: 22px;
        }

        </style>
    </head>
    <body>
        <div class="layout">
            <header>Header</header>
            <main>
                <aside>Aside</aside>
                <article>
                    <h1>Article</h1>
                    <section class="image">
                        <figure>Image</figure>
                        <figure>Image</figure>
                        <figure>Image</figure>
                    </section>
                </article>
            </main>
            <footer>footer</footer>
        </div>
    </body>
</html>
