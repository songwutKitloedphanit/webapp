<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FacebookPost</title>
        <style>
            *{
            margin:  0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            padding: 30px 16px;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            color: #1c1e21;
        }

        .post{
            width: 650px;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }
        .post-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
        }
        .page-info{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar{
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }
        .page-info h1{
            font-size: 16px;
        }
        .page-info p{
            margin-top: 3px;
            color: #65676b;
            font-size: 13px;
        }
        .sponsored{
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .privacy-icon{
            width: 32px;
            height: 32px;
            margin: -10px;
            object-fit: contain;
            opacity: 0.75;
        }
        .verified{
            width: 15px;
            height: 15px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: -2px;
        }
        .post-menu{
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }
        .post-menu button{
            width: 32px;
            height: 32px;
            padding: 0;
            display: grid;
            place-items: center;
            border: none;
            background: transparent;
            color: #65676b;
            line-height: 1;
            cursor: pointer;
        }
        .more-button{
            font-size: 13px;
            letter-spacing: 2px;
        }
        .close-button{
            font-size: 25px;
            font-weight: 300;
        }
        .caption{
            padding: 0 12px 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        .post-image{
            display: block;
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background-color: #023430;
        }
        .link-preview{
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background-color: #f0f2f5;
            border-bottom: 1px solid #ddd;
        }
        .link-text{
            min-width: 0;
        }
        .link-text small{
            color: #65676b;
            font-size: 11px;
        }
        .link-text h2{
            margin: 4px 0;
            font-size: 16px;
        }
        .link-text p{
            overflow: hidden;
            color: #65676b;
            font-size: 13px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .link-preview > button{
            flex-shrink: 0;
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            background-color: #e4e6eb;
            color: #1c1e21;
            font-weight: bold;
        }
        .engagement{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            color: #65676b;
            font-size: 13px;
        }
        .reaction-count{
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reaction-count img{
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .actions{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #ddd;
        }
        .actions button{
            min-height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: none;
            background-color: white;
            color: #65676b;
            font-size: 14px;
            font-weight: bold;
        }
        .actions button img{
            width: 32px;
            height: 32px;
            object-fit: contain;
            opacity: 0.75;
        }
        .actions button:hover{
            background-color: #f0f2f5;
        }
        </style>
    </head>

    <body>
        <article class="post">
            <header class="post-header">
                <div class="page-info">
                    <img class="avatar" src="images/icon.png" alt="MongoDB logo">
                    <div>
                        <h1>
                        MongoDB
                        <img class="verified" src="images/meta_.jpg" alt="Verified">
                        </h1>
                        <p class="sponsored">
                            ได้รับการสนับสนุน •
                            <img class="privacy-icon" src="images/globle.png" alt="Public">
                        </p>
                        </div>
                    </div>

                    <div class="post-menu">
                        <button class="more-button" type="button" aria-label="More options">&bull;&bull;&bull;</button>
                        <button class="close-button" type="button" aria-label="Close">&times;</button>
                    </div>
            </header>

            <p class="caption">
                Take advantage of your SQL skillset to quickly get up to speed
                on MongoDB. Don't start over, just start!
            </p>
            
            <img class="post-image"
                 src="images/post.jpg"
                 alt="MongoDB for SQL Professionals">

            <section class="link-preview">
                <div class="link-text">
                    <small>LEARN.MONGODB.COM</small>
                    <h2>Register today for free!</h2>
                    <p>
                        Are you a SQL developer who wants to use MongoDB?
                        MongoDB University ...
                    </p>
                </div>
                <button type="button">ลงทะเบียน</button>
            </section>

            <section class="engagement">
                <span class="reaction-count">
                    <img src="images/like.png" alt="Like">
                    2.4 พัน
                </span>
                <span>103 ความคิดเห็น · แชร์ 45 ครั้ง</span>
            </section>

            <footer class="actions">
                <button type="button">
                    <img src="images/likeback.png" alt="">
                    <span>ถูกใจ</span>
                </button>
                <button type="button">
                    <img src="images/comment.png" alt="">
                    <span>แสดงความคิดเห็น</span>
                </button>
                <button type="button">
                    <img src="images/share.png" alt="">
                    <span>แชร์</span>
                </button>
            </footer>

        </article>

    </body>

</html>
