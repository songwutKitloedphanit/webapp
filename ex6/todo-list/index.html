<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo List</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0;
                padding: 24px;
                background: linear-gradient(to bottom left, #d7f3e4, #9ce6b5);
                font-family: Arial, sans-serif;
            }

            .todo-app {
                width: min(100%, 560px);
                padding: 28px;
                border: 1px solid rgba(22, 59, 42, 0.12);
                border-radius: 16px;
                background: linear-gradient(to bottom left, #cff4e7, #baeecc);
                box-shadow: 0 10px 25px rgba(22, 59, 42, 0.16);
            }

            .home-link {
                display: inline-block;
                margin-bottom: 18px;
                color: #15803d;
                font-size: 14px;
                font-weight: bold;
                text-decoration: none;
            }

            .home-link:hover {
                text-decoration: underline;
            }

            .home-link:focus-visible,
            button:focus-visible,
            input:focus-visible {
                outline: 3px solid #f59e0b;
                outline-offset: 3px;
            }

            h1 {
                margin: 0 0 22px;
                color: #163b2a;
                text-align: center;
            }

            .todo-form {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            .todo-form input {
                flex: 1;
                min-width: 0;
                padding: 12px;
                border: 1px solid #c7d8ce;
                border-radius: 8px;
                background-color: white;
                color: #163b2a;
                font-size: 16px;
            }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            button {
                border: none;
                border-radius: 8px;
                padding: 0 16px;
                font-size: 15px;
                cursor: pointer;
            }

            .add-button {
                background-color: #63d879;
                color: #12351f;
            }

            .task-list {
                display: grid;
                gap: 10px;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .task-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 12px;
                border-radius: 8px;
                background-color: #e7f9ed;
            }

            .task-label {
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0;
                color: #1f2937;
            }

            .task-label span {
                overflow-wrap: anywhere;
            }

            .task-item.completed .task-label span {
                color: #6b7280;
                text-decoration: line-through;
            }

            .delete-button {
                flex-shrink: 0;
                padding: 8px 12px;
                background-color: #f87171;
                color: white;
            }

            .empty-state {
                margin: 0;
                color: #6b7280;
                text-align: center;
            }

            button:hover {
                filter: brightness(0.95);
            }

            button:active {
                transform: translateY(1px);
            }

            @media (max-width: 480px) {
                .todo-form {
                    flex-direction: column;
                }

                .add-button {
                    min-height: 42px;
                }
            }
        </style>
    </head>

    <body>
        <main class="todo-app">
            <a class="home-link" href="../index.html">← All Exercises</a>
            <h1>Todo List</h1>

            <form class="todo-form" id="todo-form">
                <label class="sr-only" for="todo-input">Task</label>
                <input id="todo-input" type="text" placeholder="Enter a task" autocomplete="off">
                <button class="add-button" type="submit">Add Task</button>
            </form>

            <p class="empty-state" id="empty-state">No tasks yet.</p>
            <ul class="task-list" id="task-list"></ul>
        </main>

        <script>
            const form = document.querySelector("#todo-form");
            const input = document.querySelector("#todo-input");
            const taskList = document.querySelector("#task-list");
            const emptyState = document.querySelector("#empty-state");

            function updateEmptyState() {
                emptyState.hidden = taskList.children.length > 0;
            }

            function addTask(taskText) {
                const taskItem = document.createElement("li");
                taskItem.className = "task-item";

                const taskLabel = document.createElement("label");
                taskLabel.className = "task-label";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";

                const taskName = document.createElement("span");
                taskName.textContent = taskText;

                checkbox.addEventListener("change", () => {
                    taskItem.classList.toggle("completed", checkbox.checked);
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.type = "button";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => {
                    taskItem.remove();
                    updateEmptyState();
                });

                taskLabel.append(checkbox, taskName);
                taskItem.append(taskLabel, deleteButton);
                taskList.append(taskItem);
                updateEmptyState();
            }

            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const taskText = input.value.trim();
                if (taskText === "") return;

                addTask(taskText);
                input.value = "";
                input.focus();
            });

            updateEmptyState();
        </script>
    </body>
</html>
