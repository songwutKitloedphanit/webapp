<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <link rel="stylesheet" href="../assets/style.css">
    <style>
        *{
            margin:  0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            background-color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .card{
            width: 300px;
            background-color: white;
            text-align: center;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }
        .card img{
            width: 100%;
            display: block;
        }
        .card h1{
            font-size: 28px;
            margin-top: 20px;

        }
        .card .title{
            color: gray;
            font-size: 18px;
            margin: 10px 0;
        }
        .icon{
            margin: 20px 0;
        }
        .icon a{
            color: black;
            text-decoration: none;
            font-size: 22px;
            margin: 0 6px;
        }
        .card .contact{
            background-color: black;
            color: white;
            padding: 14px 0;
            margin-top: 20px;
            cursor: pointer;
        }
        .card .contact:hover{
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../assets/images/p1.png" alt="John Doe">
        <h1>John Doe</h1>
        <p class="title">CEO &amp; Founder, Example</p>
        <p>Harvard University</p>
        <p class="contact">Contact</p>
    </div>
    <a class="switch" href="../profile2/">Next &rarr;</a>
</body>
</html>
